# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
        exclude: ^possible feature calculation/
    -   id: end-of-file-fixer
        exclude: ^possible feature calculation/
    -   id: check-yaml
        exclude: ^possible feature calculation/
    -   id: check-toml
        exclude: ^possible feature calculation/
    -   id: check-added-large-files
    -   id: detect-private-key
-   repo: https://github.com/psf/black
    rev: 24.8.0 # Choose a version consistent with your project
    hooks:
    -   id: black
        args: [--config=backend/pyproject.toml] # Point to Black's config if in backend
        files: ^backend/.*\.py$ # Only run on .py files in backend/
-   repo: https://github.com/pycqa/flake8
    rev: 7.1.0 # Choose a version consistent with your project
    hooks:
    -   id: flake8
        args: [--config=backend/.flake8] # Point to Flake8's config
        files: ^backend/.*\.py$ # Only run on .py files in backend/
        # Consider adding additional_dependencies if your flake8 plugins are not in requirements.txt
        # additional_dependencies: [flake8-bugbear]
