version: "3.9"
services:
  api:
    build: .
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8000/health"]
      interval: 30s
  ui:
    build: .
    command: streamlit run app/streamlit_app.py \
             --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on: [api]
