[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppes"
version = "1.0.0"
description = "Petroleum Production Engineering Software (Guo 2007)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Engineering Software Planning"}]
dependencies = [
    "numpy>=1.26", "scipy>=1.11", "pandas>=2.1",
    "pydantic>=2.5", "matplotlib>=3.8", "typer>=0.9",
    "openpyxl>=3.1", "reportlab>=4.0", "python-docx>=1.1", "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-regressions>=2.5",
       "hypothesis>=6.98", "ruff", "mypy"]
ui  = ["streamlit>=1.30"]
api = ["fastapi>=0.109", "uvicorn[standard]>=0.27"]

[project.scripts]
ppes = "ppes.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ppes = ["data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
