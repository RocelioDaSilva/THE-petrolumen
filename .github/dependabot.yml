version: 2
updates:
  # Enable version updates for Python/pip (backend)
  - package-ecosystem: "pip"
    directory: "/backend" # Location of package manifests
    schedule:
      interval: "weekly"
    target-branch: "main" # Or your default branch
    reviewers:
      - "jules-agent" # Placeholder, replace with actual reviewers/teams
    labels:
      - "dependencies"
      - "python"
      - "backend"

  # Enable version updates for the root JavaScript/npm project
  - package-ecosystem: "npm"
    directory: "/" # Root package manifests
    schedule:
      interval: "weekly"
    target-branch: "main" # Or your default branch
    reviewers:
      - "jules-agent" # Placeholder, replace with actual reviewers/teams
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"
