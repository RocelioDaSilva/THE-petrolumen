

productName = "PetroLúmen"
version = "0.1.0"
identifier = "com.petrolumen.dev"

[build]
beforeDevCommand = "npm --prefix .. run dev"
# Temporarily skip running the frontend build step when creating installers.
beforeBuildCommand = ""
frontendDist = "dist"
devUrl = "http://localhost:3000"

[allowlist]
all = false
	[allowlist.fs]
	all = true
	scope = ["**"]
	[allowlist.dialog]
	all = true
	[allowlist.shell]
	open = true

[bundle]
active = true
category = "DeveloperTool"
copyright = ""
externalBin = []
icon = ["icons/icon.png"]
longDescription = "PetroLúmen - Aplicativo de análise de dados petrofísicos"
resources = ["bundle/resources/backend.exe", "dist"]
shortDescription = "PetroLúmen Desktop"
targets = "all"
	[bundle.macOS]
	entitlements = ""
	exceptionDomain = ""
	frameworks = []
	providerShortName = ""
	icon = []
	[bundle.windows]
	certificateThumbprint = ""
	digestAlgorithm = "sha256"
	timestampUrl = ""

[security]
csp = ""

[updater]
active = false

[[windows]]
label = "main"
url = "index.html"
fullscreen = false
height = 768
resizable = true
title = "PetroLúmen"
width = 1024
decorations = true




