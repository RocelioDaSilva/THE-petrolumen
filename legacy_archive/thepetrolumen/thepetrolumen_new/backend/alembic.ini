[alembic]
# path to migration scripts
script_location = alembic

# Target database URL
# This will be OVERRIDDEN by backend/database.py when running migrations
# or by backend/alembic/env.py based on settings.
# It serves as a default or placeholder if running alembic CLI commands directly
# without the application's runtime context.
sqlalchemy.url = sqlite:///./placeholder_for_alembic_cli.db

# Location of version scripts, relative to script_location
# version_locations = %(here)s/versions
# Example for multiple version locations:
# version_locations =
#   alembic/versions/auth_module
#   alembic/versions/main_app

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Post write hooks
# Example:
# [post_write_hooks]
# hooks = autopep8
# autopep8.type = exec
# autopep8.entrypoint = autopep8
# autopep8.options = -i --max-line-length=120 ${ALEMBIC_SCRIPT_LOCATION}/versions/${ALEMBIC_REVISION}.py
#
# hooks = jinja2
# jinja2.type = exec
# jinja2.entrypoint = my_custom_script
# jinja2.options = --template my_template.j2 ${ALEMBIC_SCRIPT_LOCATION}/versions/${ALEMBIC_REVISION}.py

# You can define template files here used by `alembic revision -m <msg> --template=my_template`
# default_template_path = alembic/templates
# file_template = %%(rev)s_%%(slug)s
# revision_environment = true
# timezone = UTC
# track_dependencies = true
