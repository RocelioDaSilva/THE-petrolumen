[package]
name = "petrolumen-desktop"
version = "0.1.0"
description = "Aplicativo desktop PetroLúmen"
authors = ["PetroLúmen Development Team"]
license = ""
repository = ""
default-run = "petrolumen-desktop"
edition = "2021"
rust-version = "1.59"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.5.1", features = ["config-toml"] } # Using specific resolved version
log = "0.4"
env_logger = "0.10"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
