productName = "Petrolumen"
version = "0.1.0"
identifier = "com.petrolumen.dev" # Placeholder, should be unique

[build]
beforeDevCommand = "npm run dev"
beforeBuildCommand = "npm run build"
frontendDist = "../out" # Usually 'out' or 'dist' for Next.js static export
devUrl = "http://localhost:3000"

[app]

  [[app.windows]]
  label = "main"
  title = "Petrolumen"
  width = 800
  height = 600

  [app.security]
  csp = ""

[bundle]
active = true
targets = "all" # Example: adjust as needed